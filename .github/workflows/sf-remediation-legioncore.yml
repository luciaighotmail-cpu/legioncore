name: Sealie Federation CI — LegionCore (SF-R08)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-legioncore:
    name: CMake Build & Fail-Closed Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CMakeLists.txt exists (fail closed)
        run: test -f CMakeLists.txt

      - name: Configure CMake with testing enabled
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build LegionCore and test targets
        run: cmake --build build --parallel

      - name: Execute CTest suite (fail on no tests or any failure)
        run: ctest --test-dir build --output-on-failure --no-tests=error
