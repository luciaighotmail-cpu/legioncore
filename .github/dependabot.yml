version: 2
updates:
  # GitHub Actions (SF-R08 CI workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
      - "sf-remediation"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
